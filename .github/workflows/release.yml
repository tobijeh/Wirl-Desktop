# On every push to main: pick the next version, build the signed installer,
# and publish a GitHub Release with the installer, its .sig signature and
# latest.json (the manifest installed copies check for updates).
#
# Signing: the public key is in src-tauri/tauri.conf.json. The private key is
# the TAURI_SIGNING_PRIVATE_KEY secret. It has no password, so the password is
# set to an empty string below (not a secret). See README.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # whisper-rs-sys generates its bindings with bindgen (LLVM is preinstalled on
  # the Windows runner). Its bundled bindings are for Linux and don't compile for MSVC.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            $msg = "The TAURI_SIGNING_PRIVATE_KEY secret is missing, so the release can't be signed. Add it under Settings > Secrets and variables > Actions (see README, 'Updates and the signing key')."
            Write-Host "::error::$msg"
            "### $msg" >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Next version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $parts = $base.Split('.')
          $mm = "$($parts[0]).$($parts[1])"
          $max = -1
          foreach ($t in (git tag --list "v$mm.*")) {
            if ($t -match "^v$([regex]::Escape($mm))\.(\d+)$") { $max = [Math]::Max($max, [int]$Matches[1]) }
          }
          $next = "$mm.$($max + 1)"
          Write-Host "Releasing $next"
          "version=$next" >> $env:GITHUB_OUTPUT
          @{ version = $next } | ConvertTo-Json | Set-Content -Path "$env:GITHUB_WORKSPACE/tauri.release.conf.json" -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - name: Icons
        run: cargo run -p wirl-icons -- all

      # whisper.cpp's Vulkan backend builds a helper (vulkan-shaders-gen) as its own
      # CMake project. Under the Visual Studio generator that sub-build can't find
      # the compiler, so the sidecars build with Ninja inside the MSVC environment.
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version

      - name: Whisper sidecars
        env:
          CMAKE_GENERATOR: Ninja
        shell: pwsh
        run: ./scripts/build-sidecars.ps1

      - run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password. An empty value (not a missing one) keeps signing from failing.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: npm run tauri
          args: --target x86_64-pc-windows-msvc --config ${{ github.workspace }}/tauri.release.conf.json
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Wirl ${{ steps.version.outputs.version }}
          releaseBody: |
            Download and run the `Wirl_..._x64-setup.exe` installer below.
            Already installed? Wirl updates itself: look for "Restart to update" in the tray menu.
            First install: if Windows shows "Windows protected your PC", click **More info**, then **Run anyway** (Wirl isn't code-signed).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
