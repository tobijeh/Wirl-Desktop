# Pull request checks: lint, unit tests, and a full Windows build.
# No API keys are used here; the Claude quality test is run manually only.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # whisper-rs-sys generates its bindings with bindgen on the Windows runner
  # (LLVM is preinstalled there). Its bundled bindings are for Linux and don't
  # compile for MSVC.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Icons (ui/assets/icons → src-tauri/icons)
        run: cargo run -p wirl-icons -- all

      - name: Format
        run: cargo fmt --all --check

      - name: UI scripts
        run: |
          node scripts/check-ui.mjs
          node scripts/test-ui.mjs
          node --test relay/test/mailbox.test.mjs

      # tauri-build checks that bundled sidecars exist; lint doesn't need real ones.
      - name: Placeholder sidecars for type-checking
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($n in "wirl-whisper", "wirl-whisper-cpu", "wirl-sensevoice") {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$n-x86_64-pc-windows-msvc.exe" | Out-Null
          }

      # The sidecars are checked in the build job, where they're built.
      - name: Clippy
        run: cargo clippy --workspace --exclude wirl-whisper --exclude wirl-sensevoice --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --exclude wirl-whisper --exclude wirl-sensevoice

  build:
    name: Windows build
    runs-on: windows-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: |
            . -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - name: Icons
        run: cargo run -p wirl-icons -- all

      # whisper.cpp's Vulkan backend builds a helper (vulkan-shaders-gen) as its own
      # CMake project. Under the Visual Studio generator that sub-build can't find
      # the compiler, so the sidecars build with Ninja inside the MSVC environment.
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version

      - name: Speech sidecars (Whisper Vulkan + CPU, SenseVoice)
        env:
          CMAKE_GENERATOR: Ninja
          # Short build folder: the Vulkan build's nested paths pass the Windows path limit under D:\a\...
          WIRL_SIDECAR_TARGET: C:\s
        shell: pwsh
        run: ./scripts/build-sidecars.ps1

      - name: Sidecar check (Whisper clippy)
        env:
          CMAKE_GENERATOR: Ninja
        run: cargo clippy -p wirl-whisper --target x86_64-pc-windows-msvc --target-dir C:\s\cpu -- -D warnings

      - name: Sidecar check (SenseVoice clippy)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo clippy -p wirl-sensevoice --target x86_64-pc-windows-msvc --target-dir C:\s\sv -- -D warnings

      # The SenseVoice sidecar must start on its own (no missing DLLs) and
      # answer the protocol: send a ping, expect "ready" and "pong".
      - name: Sidecar smoke test (SenseVoice starts without DLLs)
        shell: pwsh
        run: |
          $exe = "src-tauri/binaries/wirl-sensevoice-x86_64-pc-windows-msvc.exe"
          $out = '{"type":"ping","id":7}' | & $exe
          if ($LASTEXITCODE -ne 0) { throw "wirl-sensevoice exited with $LASTEXITCODE" }
          Write-Host $out
          if (-not ($out -match '"type":"ready"') -or -not ($out -match '"type":"pong","id":7')) { throw "unexpected output" }
          & dumpbin /dependents $exe

      # Real recognition on Windows with the official model and one of its test clips.
      - name: Sidecar smoke test (SenseVoice recognises Cantonese)
        shell: pwsh
        run: |
          $name = "sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09"
          Invoke-WebRequest "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$name.tar.bz2" -OutFile "$env:RUNNER_TEMP/sv.tar.bz2"
          $hash = (Get-FileHash "$env:RUNNER_TEMP/sv.tar.bz2" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "7305f7905bfcf77fa0b39388a313f3da35c68d971661a65475b56fb2162c8e63") { throw "model checksum changed: $hash" }
          tar -xjf "$env:RUNNER_TEMP/sv.tar.bz2" -C $env:RUNNER_TEMP
          $out = & src-tauri/binaries/wirl-sensevoice-x86_64-pc-windows-msvc.exe --model "$env:RUNNER_TEMP/$name" "$env:RUNNER_TEMP/$name/test_wavs/yue-0.wav"
          if ($LASTEXITCODE -ne 0) { throw "wirl-sensevoice exited with $LASTEXITCODE" }
          Write-Host $out
          $text = ("$out" -split "`t")[2]
          if (-not $text -or $text.Trim().Length -lt 4) { throw "no text recognised" }

      - run: npm ci

      # Pull request builds aren't signed; only the Release workflow has the key.
      - name: Build installer
        shell: pwsh
        run: |
          @{ bundle = @{ createUpdaterArtifacts = $false } } | ConvertTo-Json | Set-Content -Path "$env:RUNNER_TEMP/tauri.ci.conf.json" -Encoding utf8
          npm run tauri build -- --target x86_64-pc-windows-msvc --config "$env:RUNNER_TEMP/tauri.ci.conf.json"

      - uses: actions/upload-artifact@v4
        with:
          name: wirl-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
